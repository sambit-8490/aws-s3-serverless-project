
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Management System</h1>

        <div class="form-box">
            <h2>Add New Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="studentId"
                    placeholder="Student ID"
                    required>

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required>

                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required>

                <input
                    type="text"
                    id="city"
                    placeholder="City"
                    required>

                <button type="submit">Submit Student</button>

            </form>

            <p id="message"></p>
        </div>

        <div class="table-box">

            <h2>Student Records</h2>

            <button onclick="loadStudents()">
                Refresh Records
            </button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>City</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                </tbody>
            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
